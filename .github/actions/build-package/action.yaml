name: Build package
description: Bumps version, installs dependencies, lints, tests and builds package

inputs:
  publish_type:
    required: true
    description: "beta or release"
  version_type:
    required: true
    description: "Beta: prerelease, preminor, premajor. Release: patch, minor, major"
  reader-token:
    required: false
    default: ""
    description: "GitHub Packages token for installing private @navikt packages"

outputs:
  version_tag:
    description: "Created npm version tag"
    value: ${{ steps.bump-version.outputs.version_tag }}

runs:
  using: composite
  steps:
    - name: Validate release on main
      if: inputs.publish_type == 'release' && github.ref != 'refs/heads/main'
      shell: bash
      run: |
        echo "Release can only be published from the main branch"
        exit 1

    - name: Setup node.js and pnpm
      uses: navikt/navno-actions/setup-node-pnpm@v1
      with:
        reader-token: ${{ inputs.reader-token }}

    - name: Configure git
      shell: bash
      env:
        ACTOR: ${{ github.actor }}
      run: |
        git config --global user.name "$ACTOR"
        git config --global user.email "$ACTOR@users.noreply.github.com"

    - name: Bump version
      id: bump-version
      shell: bash
      env:
        PUBLISH_TYPE: ${{ inputs.publish_type }}
        VERSION_TYPE: ${{ inputs.version_type }}
      run: |
        if [ "$PUBLISH_TYPE" = "beta" ]; then
          VERSION_TAG=$(npm version "$VERSION_TYPE" --preid beta)
        else
          VERSION_TAG=$(npm version "$VERSION_TYPE")
        fi

        echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

    - name: Lint all packages
      shell: bash
      run: pnpm run lint:moduler

    - name: Run tests
      shell: bash
      run: pnpm run test

    - name: Build package
      shell: bash
      run: pnpm run build