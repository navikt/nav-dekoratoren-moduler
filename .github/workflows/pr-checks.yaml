name: PR Checks
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node.js and pnpm
        uses: navikt/navno-actions/setup-node-pnpm@v1
        with:
          reader-token: ${{ secrets.READER_TOKEN }}
      - name: Lint
        run: pnpm run lint:moduler
      - name: Run tests
        run: pnpm run test
      - name: Build
        run: pnpm run build
